<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Exam Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .page-view { display: none; }
    .page-view.block { display: block; }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="flex h-screen overflow-hidden">

    <aside id="sidebar" class="hidden md:flex w-60 bg-white border-r border-slate-200 flex-col shrink-0 absolute md:relative z-50 h-full">
      <div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center">
        <div>
           <h1 class="text-sm font-black text-slate-900">Smart Exam</h1>
           <p id="schoolName" class="text-[10px] text-slate-400 font-medium">Loading...</p>
        </div>
        <button onclick="toggleSidebar()" class="md:hidden"><i data-lucide="x"></i></button>
      </div>

      <div class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <a href="#" onclick="switchPage('dashboard')" class="w-full flex items-center gap-3 rounded-lg bg-indigo-600 px-3 py-2 text-xs font-semibold text-white">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
        </a>
        <a href="#" onclick="switchPage('students')" class="w-full flex items-center gap-3 rounded-lg px-3 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100">
          <i data-lucide="users" class="w-4 h-4 text-slate-400"></i> Data Siswa
        </a>
      </div>

      <div class="border-t border-slate-100 p-4">
        <p id="operatorName" class="text-xs font-bold text-slate-900">Loading...</p>
        <button onclick="logout()" class="mt-2 flex items-center gap-2 text-xs font-medium text-rose-500">
          <i data-lucide="log-out" class="w-4 h-4"></i> Keluar
        </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="p-4 md:hidden">
        <button onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
      </header>

      <div class="flex-1 overflow-y-auto p-6">
        <div id="view-dashboard" class="page-view block">
          <h2 id="pageTitle" class="text-2xl font-black text-slate-900">Dashboard</h2>
          <p id="pageSubtitle" class="text-sm text-slate-500 mb-6">Selamat datang kembali.</p>
        </div>
        <div id="view-students" class="page-view">
           <h2 class="text-2xl font-black text-slate-900 mb-6">Data Siswa</h2>
        </div>
      </div>
    </main>
  </div>

<script>
  lucide.createIcons();
  
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('hidden');
  }

  function logout() {
    localStorage.removeItem('smart_exam_user');
    window.location.href = 'index.html';
  }

  function switchPage(pageId) {
    document.querySelectorAll('.page-view').forEach(el => el.classList.remove('block'));
    document.getElementById('view-' + pageId).classList.add('block');
    
    // Update Judul Dinamis
    const titles = {
        'dashboard': 'Dashboard',
        'students': 'Data Siswa'
    };
    document.getElementById('pageTitle').innerText = titles[pageId] || 'Smart Exam';
    
    if (window.innerWidth < 768) toggleSidebar();
  }
</script>
<script src="js/dashboard.js"></script>
</body>
</html>
