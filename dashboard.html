<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Exam Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .page-view {
      display: none;
    }

    .page-view.active {
      display: block;
    }

    .sidebar-collapsed {
      width: 88px;
    }

    .sidebar-collapsed .menu-text,
    .sidebar-collapsed .logo-text,
    .sidebar-collapsed .section-title,
    .sidebar-collapsed .upgrade-card {
      display: none;
    }

    .sidebar-collapsed .menu-item {
      justify-content: center;
    }
  </style>
</head>

<body class="bg-slate-100 overflow-hidden">

<div class="flex h-screen">

  <!-- SIDEBAR -->
  <aside id="sidebar"
    class="w-64 bg-white border-r border-slate-200 flex flex-col transition-all duration-300">

    <!-- HEADER -->
    <div class="h-16 px-4 border-b border-slate-100 flex items-center justify-between">

      <div class="flex items-center gap-3 overflow-hidden">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center shrink-0">
          <span class="text-white font-bold">S</span>
        </div>

        <div class="logo-text">
          <h1 class="text-sm font-black leading-none">Smart Exam</h1>
          <p class="text-[11px] text-slate-400">SMPN 28 Malang</p>
        </div>
      </div>

      <!-- TOGGLE -->
      <button onclick="toggleSidebar()"
        class="w-8 h-8 rounded-lg hover:bg-slate-100 flex items-center justify-center">
        <i data-lucide="panel-left-close" class="w-4 h-4"></i>
      </button>

    </div>

    <!-- MENU -->
    <div class="flex-1 overflow-y-auto px-3 py-4 space-y-1">

      <a id="dashboardMenu"
        href="#"
        onclick="switchPage('dashboard', this)"
        class="menu-item flex items-center gap-3 rounded-xl px-3 py-3 bg-indigo-600 text-white text-sm font-semibold">

        <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i>
        <span class="menu-text">Dashboard</span>
      </a>

      <a id="studentsMenu"
        href="#"
        onclick="switchPage('students', this)"
        class="menu-item flex items-center gap-3 rounded-xl px-3 py-3 text-slate-600 hover:bg-slate-100 text-sm font-medium">

        <i data-lucide="users" class="w-5 h-5 shrink-0"></i>
        <span class="menu-text">Data Siswa</span>
      </a>

      <a id="examsMenu"
        href="#"
        onclick="switchPage('exams', this)"
        class="menu-item flex items-center gap-3 rounded-xl px-3 py-3 text-slate-600 hover:bg-slate-100 text-sm font-medium">

        <i data-lucide="book-open" class="w-5 h-5 shrink-0"></i>
        <span class="menu-text">Manajemen Ujian</span>
      </a>

      <div class="pt-4">
        <p class="section-title px-3 mb-2 text-xs font-bold text-slate-400 uppercase">
          Fitur Lanjutan
        </p>

        <a id="settingsMenu"
          href="#"
          onclick="switchPage('settings', this)"
          class="menu-item flex items-center gap-3 rounded-xl px-3 py-3 text-slate-600 hover:bg-slate-100 text-sm font-medium">

          <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
          <span class="menu-text">Pengaturan</span>
        </a>
      </div>

    </div>

    <!-- FOOTER -->
    <div class="border-t border-slate-100 p-3">

      <!-- UPGRADE -->
      <div class="upgrade-card rounded-2xl bg-gradient-to-br from-amber-400 to-yellow-500 p-4 mb-3">
        <p class="text-[10px] font-bold text-white/80 uppercase">
          Upgrade PRO
        </p>

        <h3 class="text-sm font-bold text-white mt-1">
          Monitoring realtime lebih lengkap
        </h3>

        <button class="mt-3 w-full rounded-xl bg-white py-2 text-xs font-bold text-amber-600">
          Upgrade
        </button>
      </div>

      <!-- LOGOUT -->
      <button onclick="logout()"
        class="menu-item w-full flex items-center gap-3 rounded-xl px-3 py-3 text-rose-500 hover:bg-rose-50 text-sm font-medium">

        <i data-lucide="log-out" class="w-5 h-5 shrink-0"></i>
        <span class="menu-text">Keluar</span>
      </button>

    </div>

  </aside>

  <!-- CONTENT -->
  <main class="flex-1 overflow-y-auto">

    <div class="p-6">

      <div id="view-dashboard" class="page-view active">
        Dashboard Content...
      </div>

      <div id="view-students" class="page-view">
        Data Siswa...
      </div>

      <div id="view-exams" class="page-view">
        Manajemen Ujian...
      </div>

      <div id="view-settings" class="page-view">
        Pengaturan...
      </div>

    </div>

  </main>

</div>

<script>

  lucide.createIcons();

  function logout() {
    localStorage.removeItem('smart_exam_user');
    window.location.href = 'index.html';
  }

  function toggleSidebar() {
    document.getElementById('sidebar')
      .classList.toggle('sidebar-collapsed');
  }

  function switchPage(pageId, menuEl) {

    document.querySelectorAll('.page-view')
      .forEach(el => el.classList.remove('active'));

    document.getElementById('view-' + pageId)
      .classList.add('active');

    document.querySelectorAll('.menu-item')
      .forEach(el => {
        el.classList.remove('bg-indigo-600', 'text-white');
      });

    menuEl.classList.add('bg-indigo-600', 'text-white');
  }

</script>

</body>
</html>
